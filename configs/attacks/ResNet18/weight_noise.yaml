watermarked_checkpoint: ./checkpoints/resnet18_cifar10_uchida.pt
attack: weight_noise
relative_std: 0.05   # noise std = 5% of each layer's own weight std
seed: 7
dataset: cifar10
model: resnet18_cifar

checkpoint_dir: ./checkpoints
checkpoint_name: resnet18_cifar10_uchida_attacked_weight_noise.pt

mlflow:
  enabled: true
  experiment_name: dnn-watermark-robustness
  run_name: resnet18_cifar10_uchida_weight_noise